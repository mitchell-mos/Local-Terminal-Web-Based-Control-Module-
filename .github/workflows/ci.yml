name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0

      - name: Enable the pinned package manager
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

  macos:
    name: Verify macOS launchers
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check scripts and property lists
        run: |
          zsh -n ControlModule support/mac/*.sh
          plutil -lint support/mac/App.plist support/mac/Setup.plist

      - name: Build native launchers from source
        run: |
          mkdir -p "$RUNNER_TEMP/control-module-launchers"
          support/mac/setup.sh "$RUNNER_TEMP/control-module-launchers/Setup.app"
          support/mac/remove.sh "$RUNNER_TEMP/control-module-launchers/Uninstall.app"

      - name: Check ARM launchers
        run: |
          plutil -lint "$RUNNER_TEMP/control-module-launchers/Setup.app/Contents/Info.plist"
          plutil -lint "$RUNNER_TEMP/control-module-launchers/Uninstall.app/Contents/Info.plist"
          file "$RUNNER_TEMP/control-module-launchers/Setup.app/Contents/MacOS/Setup" | grep -q arm64
          file "$RUNNER_TEMP/control-module-launchers/Uninstall.app/Contents/MacOS/applet" | grep -q arm64

      - name: Verify app signatures
        run: |
          codesign --verify --deep --strict "$RUNNER_TEMP/control-module-launchers/Setup.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/control-module-launchers/Uninstall.app"

      - name: Run process-control tests
        run: python3 -B -m unittest discover -s support/tests -p 'test_*.py'
