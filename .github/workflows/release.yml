name: Publish ARM64 release

on:
  push:
    tags:
      - "v*.*.*"

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest, and publish
    runs-on: macos-14
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.17.0

      - name: Enable the pinned package manager
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="$(node -e 'const v = require("./version.json"); process.stdout.write(`v${v.major}.${String(v.update).padStart(2, "0")}.${v.fix}`)')"
          test "$RELEASE_TAG" = "$expected_tag"

      - name: Build and verify ARM64 archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          support/mac/release.sh
          cd release
          shasum -a 256 -c "Control-Module-$RELEASE_TAG-macOS-arm64.zip.sha256"

      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-path: release/Control-Module-${{ github.ref_name }}-macOS-arm64.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/Control-Module-$RELEASE_TAG-macOS-arm64.zip" \
            "release/Control-Module-$RELEASE_TAG-macOS-arm64.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Control Module $RELEASE_TAG"
