name: Version policy

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  version:
    name: Check version increment
    runs-on: ubuntu-latest
    steps:
      - name: Accept automated dependency maintenance
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Dependabot maintenance does not publish an app release."

      - name: Checkout repository
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version increment
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node support/version.mjs check "$BASE_SHA"
